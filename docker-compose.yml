services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    working_dir: /home/dynamodblocal
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Advertise the IPv4 loopback explicitly rather than "localhost".
      # On hosts where "localhost" resolves to IPv6 (::1) first (e.g. Docker
      # Desktop/colima, which only forward the published port on IPv4
      # 127.0.0.1), a "localhost" advertised listener makes librdkafka
      # clients try ::1:9092 first and hit "Connection refused", causing
      # flaky/failing connections in the live-Kafka integration tests.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  aurora-postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    environment:
      POSTGRES_USER: canonical
      POSTGRES_PASSWORD: canonical
      POSTGRES_DB: canonical
    ports:
      - "5432:5432"
    volumes:
      - aurora-postgres-data:/var/lib/postgresql/data
      - ./db/aurora-postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  dynamodb-data:
  aurora-postgres-data:
